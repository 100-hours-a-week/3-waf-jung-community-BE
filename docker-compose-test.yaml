version: '3.8'

services:
  backend:
    image: registry.ktb-waf.cloud/community-backend:${BE_IMAGE_TAG:-latest}
    container_name: community-backend
    ports:
      - "8080:8080"
    environment:
      # Database
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # AWS
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      # CORS
      - FRONTEND_URL=${FRONTEND_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - community-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: registry.ktb-waf.cloud/community-frontend:${FE_IMAGE_TAG:-latest}
    container_name: community-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - community-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  community-network:
    driver: bridge

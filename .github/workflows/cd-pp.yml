name: CD (Direct Deploy)

on:
  pull_request:
    branches: [pp]
    types: [closed]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/ci.yml'

env:
  REGISTRY: registry.ktb-waf.cloud
  BE_IMAGE_NAME: community-backend
  FE_IMAGE_NAME: community-frontend

jobs:
#  test:
